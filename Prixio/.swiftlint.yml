opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - discouraged_optional_boolean
  - redundant_nil_coalescing
  - implicit_return
  - sorted_imports

disabled_rules:
  - file_length
  - function_parameter_count
  - cyclomatic_complexity
  - todo
  - identifier_name # allow short ids for SwiftData relationships

included:
  - .

excluded:
  - Carthage
  - Pods
  - .build
  - DerivedData

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_function_declarations: false
  ignores_urls: true

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true

force_cast: error
force_try: warning

reporter: xcode
